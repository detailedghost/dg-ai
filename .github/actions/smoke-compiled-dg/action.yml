name: Smoke the compiled dg
description: Run the compiled dg for this runner and check its version, its command trees and the removed-name notice. Each dg call prints its exit code and stderr.
inputs:
  runtime:
    description: The runtime.json platform key; the program is ./dg-<runtime>, with .exe on Windows.
    required: true
  version:
    description: The version that dg --version must print.
    required: true
runs:
  using: composite
  steps:
    - name: Run the compiled dg for this platform
      shell: bash
      env:
        RUNTIME_KEY: ${{ inputs.runtime }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        program="./dg-${RUNTIME_KEY}"
        if [ "${RUNNER_OS}" = Windows ]; then
          program="${program}.exe"
        else
          chmod +x "$program"
        fi
        home="$(mktemp -d)"
        export DG_HOME="$home/dg" HOME="$home/home" USERPROFILE="$home/home"
        mkdir -p "$HOME"
        err="$home/stderr"
        run_dg() {
          local code=0
          out="$("$program" "$@" 2>"$err")" || code=$?
          echo "dg $* exited ${code}"
          if [ -s "$err" ]; then
            echo "stderr of dg $*:"
            cat "$err"
          fi
          return "$code"
        }
        run_dg --version
        version="$out"
        run_dg skills --version
        skills="$out"
        if [ "$version" != "$VERSION" ] || [ "$skills" != "$VERSION" ]; then
          echo "::error::the compiled dg printed '${version}' and '${skills}', expected ${VERSION}"
          exit 1
        fi
        run_dg pw --help
        if ! grep -q "Usage: pw" <<<"$out"; then
          echo "::error::dg pw --help printed no pw usage:"
          echo "$out"
          exit 1
        fi
        run_dg phone --help
        run_dg job --help
        code=0
        run_dg start || code=$?
        if [ "$code" != 1 ] || ! grep -q "stays under its group" "$err"; then
          echo "::error::dg start must exit 1 with a hint, got exit ${code}"
          exit 1
        fi

    - name: Check that an old name gives the removed-name notice
      if: runner.os != 'Windows'
      shell: bash
      env:
        RUNTIME_KEY: ${{ inputs.runtime }}
      run: |
        set -euo pipefail
        ln -s "$PWD/dg-${RUNTIME_KEY}" dg-skills
        if out="$(./dg-skills --version 2>&1)"; then
          echo "::error::dg-skills must exit 1"
          exit 1
        fi
        grep -q "the dg-skills command is removed" <<<"$out"
