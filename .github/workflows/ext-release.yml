name: Ext - Release

# Builds and publishes an ext-vX.X.X release whenever extension or shared-package
# source changes land on master. Runs BLT first so a broken build never ships.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - master
    paths:
      - pkg/extension/**
      - pkg/common/**
      - .github/workflows/ext-release.yml

# Queue, don't cancel: a cancelled run skips its failure-cleanup step (that only
# fires on `if: failure()`, never on `cancelled()`), which can leave a half-published
# release with no rollback. The existing "already exists" check makes a queued rerun free.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  blt:
    uses: ./.github/workflows/ext-blt.yml

  release:
    needs: blt
    permissions:
      contents: write # create release + tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mask secrets in later log output
        uses: ./.github/actions/mask-secrets

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1

      - name: Install
        working-directory: pkg/extension
        run: bun install --frozen-lockfile

      - name: Build + zip (chrome + firefox)
        working-directory: pkg/extension
        run: |
          bun run zip
          bun run zip:firefox

      - name: Read extension version
        id: ver
        run: echo "version=$(node -p "require('./pkg/extension/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish release (skip if version already exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.ver.outputs.version }}"
          tag="ext-v${version}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists — build validated, nothing to publish."
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes "Automated build of the dg-ai-extension ($tag)." \
            "pkg/extension/.output/dg-ai-extension-${version}-chrome.zip" \
            "pkg/extension/.output/dg-ai-extension-${version}-firefox.zip"

      - name: Clean up on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf pkg/extension/.output
          version=$(node -p "require('./pkg/extension/package.json').version" 2>/dev/null || echo "")
          if [ -n "$version" ]; then
            tag="ext-v${version}"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
            gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" --method DELETE 2>/dev/null || true
          fi
