---
name: Phone - Wormhole pin check

on:
  pull_request:
    paths:
      - pkg/dg-agent/src/phone/wormhole.ts
      - scripts/pin-wormhole.ts
      - .github/workflows/wormhole-pin.yml
  workflow_dispatch:

concurrency:
  group: wormhole-pin-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  wormhole-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1

      - name: Install workspace dependencies without postinstall scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download the 12 release assets and compare them to the pin table
        run: bun scripts/pin-wormhole.ts --check
