name: Ext - Build, Lint, and Test

on:
  pull_request:
    paths:
      - pkg/extension/**
      - pkg/common/**
      - .github/workflows/ext-blt.yml
  workflow_call:

# The group is this file's own name, not github.workflow: in a called workflow
# that expression resolves to the CALLER's name, so a release invoking this build
# would land in its own group and cancel the run it belongs to. Cancelling is also
# limited to pull_request runs, so a release's queued rerun is never cut short.
concurrency:
  group: ext-blt-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ext-blt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Install
        working-directory: pkg/extension
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: pkg/extension
        run: bun run lint

      - name: Test
        working-directory: pkg/extension
        run: bun test

      - name: Build
        working-directory: pkg/extension
        run: bun run build
