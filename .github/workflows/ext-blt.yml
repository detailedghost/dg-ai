name: Ext - Build, Lint, and Test

on:
  pull_request:
    paths:
      - pkg/extension/**
      - pkg/common/**
      - .github/workflows/ext-blt.yml
  workflow_call:

# The group is this file's own name, not github.workflow: in a called workflow
# that expression resolves to the CALLER's name, so a release invoking this build
# would land in its own group and cancel the run it belongs to. Cancelling is also
# limited to pull_request runs, so a release's queued rerun is never cut short.
concurrency:
  group: ext-blt-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ext-blt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1

      - name: Install
        working-directory: pkg/extension
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: pkg/extension
        run: bun run lint

      - name: Test
        working-directory: pkg/extension
        env:
          DG_VERIFY_NO_SANDBOX: "1"
        run: bun test --isolate

      - name: Build
        working-directory: pkg/extension
        run: bun run build
