---
name: Skills - Build, Lint, and Test

on:
  pull_request:
    paths:
      - pkg/skills-cli/**
      - pkg/inbox/**
      - bun.lock
      - pkg/common/**
      - pkg/channel-review/**
      - plugins/dg/skills/**
      - pkg/skills-test/**
      - pkg/dg-daemon/**
      - pkg/dg-agent/**
      - pkg/extension/**
      - .github/workflows/skills-blt.yml
  workflow_call:

# The group is this file's own name, not github.workflow: in a called workflow
# that expression resolves to the CALLER's name, so a release invoking this build
# would land in its own group and cancel the run it belongs to. Cancelling is also
# limited to pull_request runs, so a release's queued rerun is never cut short.
concurrency:
  group: skills-blt-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  skills-blt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mask secrets in later log output
        uses: ./.github/actions/mask-secrets

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1

      - name: Install (root — wires workspace symlinks, skip extension postinstall)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint (common)
        working-directory: pkg/common
        run: bun run lint

      - name: Test (common)
        working-directory: pkg/common
        run: bun test

      - name: Lint (inbox)
        working-directory: pkg/inbox
        run: bun run lint

      - name: Test (inbox)
        working-directory: pkg/inbox
        run: bun test

      - name: Lint (channel-review)
        working-directory: pkg/channel-review
        run: bun run lint

      - name: Test (channel-review)
        working-directory: pkg/channel-review
        run: bun test

      - name: Lint (skills-cli)
        working-directory: pkg/skills-cli
        run: bun run lint

      # demo --verify drives a real browser with the built extension loaded. Build it
      # here, not from the spec's beforeAll: a cold wxt build inside a test counts
      # against that test's own timeout, and a build failure there surfaces as an
      # unexplained timeout instead of a failed step.
      - name: Install (extension)
        working-directory: pkg/extension
        run: bun install --frozen-lockfile

      - name: Build (extension — the verify harness loads it)
        working-directory: pkg/extension
        run: bun run build

      - name: Test (skills-cli)
        working-directory: pkg/skills-cli
        env:
          DG_VERIFY_NO_SANDBOX: "1"
        run: bun test

      - name: Build (skills-cli)
        working-directory: pkg/skills-cli
        run: bun run build

      - name: Lint (skills-test)
        working-directory: pkg/skills-test
        run: bun run lint

      - name: Test (skills-test — install logic + skill manifests + CLI smoke)
        working-directory: pkg/skills-test
        run: bun test
