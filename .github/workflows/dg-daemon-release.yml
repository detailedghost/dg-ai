---
name: DG Daemon - Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - pkg/dg-daemon/**
      - pkg/common/**
      - .github/workflows/dg-daemon-release.yml

permissions:
  contents: write

jobs:
  blt:
    uses: ./.github/workflows/dg-daemon-blt.yml

  build:
    needs: blt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            asset: dg-daemon-linux-x64
          - target: bun-linux-arm64
            asset: dg-daemon-linux-arm64
          - target: bun-darwin-x64
            asset: dg-daemon-macos-x64
          - target: bun-darwin-arm64
            asset: dg-daemon-macos-arm64
          - target: bun-windows-x64
            asset: dg-daemon-windows-x64.exe
          - target: bun-windows-arm64
            asset: dg-daemon-windows-arm64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build ${{ matrix.asset }}
        working-directory: pkg/dg-daemon
        run: >-
          bun build src/index.ts --compile
          --target=${{ matrix.target }}
          --outfile dist/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: pkg/dg-daemon/dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        working-directory: pkg/dg-daemon
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Stage the legacy dg-server asset names
        run: |
          mkdir -p legacy
          for built in dist/dg-daemon-*; do
            cp "$built" "legacy/$(basename "$built" | sed 's/^dg-daemon-/dg-server-/')"
          done

      - name: Publish dg-daemon release
        id: publish_daemon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="daemon-v${{ steps.ver.outputs.version }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists — nothing to publish."
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "DG Daemon $tag" \
            --notes "Standalone dg-daemon binaries ($tag)." \
            dist/*

      - name: Clean up the dg-daemon release on failure
        if: failure() && steps.publish_daemon.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          tag="daemon-v${{ steps.ver.outputs.version }}"
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" --method DELETE 2>/dev/null || true

      - name: Publish the legacy dg-server alias
        id: publish_server_alias
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.ver.outputs.version }}"
          tag="server-v${version}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists — nothing to publish."
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "DG Daemon $tag" \
            --notes "Alias of daemon-v${version} for builds still fetching dg-server. Removed after the next release." \
            legacy/*

      - name: Clean up the dg-server alias on failure
        if: failure() && steps.publish_server_alias.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          tag="server-v${{ steps.ver.outputs.version }}"
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" --method DELETE 2>/dev/null || true
