---
name: Skills - Release

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - master
    paths:
      - pkg/skills-cli/**
      - pkg/inbox/**
      - bun.lock
      - pkg/common/**
      - pkg/channel-review/**
      - pkg/dg-agent/**
      - .github/workflows/skills-release.yml

# Queue, don't cancel: a cancelled run skips its failure-cleanup step (that only
# fires on `if: failure()`, never on `cancelled()`), which can leave a half-published
# release with no rollback. The existing "already exists" check makes a queued rerun free.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  blt:
    uses: ./.github/workflows/skills-blt.yml

  # Cross-compile the six platform binaries in parallel.
  build:
    needs: blt
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            asset: dg-skills-linux-x64
          - target: bun-linux-arm64
            asset: dg-skills-linux-arm64
          - target: bun-darwin-x64
            asset: dg-skills-macos-x64
          - target: bun-darwin-arm64
            asset: dg-skills-macos-arm64
          - target: bun-windows-x64
            asset: dg-skills-windows-x64.exe
          - target: bun-windows-arm64
            asset: dg-skills-windows-arm64.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mask secrets in later log output
        uses: ./.github/actions/mask-secrets

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build ${{ matrix.asset }}
        working-directory: pkg/skills-cli
        run: >-
          bun build src/index.ts --compile
          --target=${{ matrix.target }}
          --outfile dist/${{ matrix.asset }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: pkg/skills-cli/dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  smoke:
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: dg-skills-linux-x64
            os: ubuntu-latest
          - asset: dg-skills-linux-arm64
            os: ubuntu-24.04-arm
          - asset: dg-skills-macos-x64
            os: macos-15-intel
          - asset: dg-skills-macos-arm64
            os: macos-14
          - asset: dg-skills-windows-x64.exe
            os: windows-latest
          - asset: dg-skills-windows-arm64.exe
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.asset }}

      - name: Mask secrets in later log output
        shell: bash
        run: |
          echo "ACTIONS_STEP_DEBUG=false" >> "$GITHUB_ENV"
          while IFS= read -r name; do
            case "$name" in
              *SECRET*|*TOKEN*|*PASSWORD*|*API_KEY*|*COOKIE*|*CREDENTIAL*|*PRIVATE*)
                value="${!name-}"
                if [ -n "$value" ]; then
                  echo "::add-mask::$value"
                fi
                ;;
            esac
          done < <(env | cut -d= -f1)

      - name: Run ${{ matrix.asset }} --help
        shell: bash
        run: |
          chmod +x "./${{ matrix.asset }}"
          if ! output="$(./${{ matrix.asset }} --help)"; then
            echo "::error::${{ matrix.asset }} --help failed to run"
            exit 1
          fi
          if [ -z "$output" ]; then
            echo "::error::${{ matrix.asset }} --help produced no output"
            exit 1
          fi
          echo "$output"

  release:
    needs: smoke
    permissions:
      contents: write # create release + tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mask secrets in later log output
        uses: ./.github/actions/mask-secrets

      - name: Read version
        id: ver
        working-directory: pkg/skills-cli
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.ver.outputs.version }}"
          tag="skills-v${version}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists — nothing to publish."
            exit 0
          fi
          # bootstrap.sh / bootstrap.ps1 verify this asset when it is present.
          # Each line is GNU sha256sum output: "<hash>  <filename>".
          # The shell expands the binary names before the redirect creates the file.
          (cd dist && sha256sum -- * > SHA256SUMS)
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Skills CLI $tag" \
            --notes "Standalone dg-skills CLI binaries ($tag). SHA256SUMS covers each platform binary." \
            dist/*

      - name: Clean up on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          version=$(node -p "require('./pkg/skills-cli/package.json').version" 2>/dev/null || echo "")
          if [ -n "$version" ]; then
            tag="skills-v${version}"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
            gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" --method DELETE 2>/dev/null || true
          fi
