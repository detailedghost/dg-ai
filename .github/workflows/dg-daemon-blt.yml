---
name: DG Daemon - Build, Lint, and Test

on:
  pull_request:
    paths:
      - pkg/dg-daemon/**
      - pkg/common/**
      - .github/workflows/dg-daemon-blt.yml
  workflow_call:

# The group is this file's own name, not github.workflow: in a called workflow
# that expression resolves to the CALLER's name, so a release invoking this build
# would land in its own group and cancel the run it belongs to. Cancelling is also
# limited to pull_request runs, so a release's queued rerun is never cut short.
concurrency:
  group: dg-daemon-blt-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dg-daemon-blt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Mask secrets in later log output
        uses: ./.github/actions/mask-secrets

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1

      - name: Install (root — wires workspace symlinks, skip extension postinstall)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint (common)
        working-directory: pkg/common
        run: bun run lint

      - name: Test (common)
        working-directory: pkg/common
        run: bun test

      - name: Lint (dg-daemon)
        working-directory: pkg/dg-daemon
        run: bun run lint

      - name: Test (dg-daemon — daemon, store, dispatch, assets)
        working-directory: pkg/dg-daemon
        run: bun test

      - name: Build (dg-daemon)
        working-directory: pkg/dg-daemon
        run: bun run build
