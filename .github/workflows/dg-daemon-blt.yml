---
name: DG Daemon - Build, Lint, and Test

on:
  pull_request:
    paths:
      - pkg/dg-daemon/**
      - pkg/common/**
      - .github/workflows/dg-daemon-blt.yml
  workflow_call:

jobs:
  dg-daemon-blt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (root — wires workspace symlinks, skip extension postinstall)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint (common)
        working-directory: pkg/common
        run: bun run lint

      - name: Test (common)
        working-directory: pkg/common
        run: bun test

      - name: Lint (dg-daemon)
        working-directory: pkg/dg-daemon
        run: bun run lint

      - name: Test (dg-daemon — daemon, store, dispatch, assets)
        working-directory: pkg/dg-daemon
        run: bun test

      - name: Build (dg-daemon)
        working-directory: pkg/dg-daemon
        run: bun run build
