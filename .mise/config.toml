redactions = ["CHANNEL_REVIEW_RELAY_SECRET_*", "DATADOG_*", "SENTRY_*"]

[tools]
bun = "1.4"

[env]
_.file = { path = ".env", redact = false }

[tasks."remote:install"]
description = "Build dg-skills and install it into DG_HOME/bin for local channel-review runs"
run = """
bun run --cwd pkg/skills-cli build
mkdir -p "${DG_HOME:-$HOME/.dg}/bin"
cp pkg/skills-cli/dist/dg-skills "${DG_HOME:-$HOME/.dg}/bin/dg-skills.new"
mv -f "${DG_HOME:-$HOME/.dg}/bin/dg-skills.new" "${DG_HOME:-$HOME/.dg}/bin/dg-skills"
"""

[tasks."remote:status"]
description = "Print the channel-review daemon state and preflight check"
run = '"${DG_SKILLS:-${DG_HOME:-$HOME/.dg}/bin/dg-skills}" channel-review status'

[tasks."remote:start"]
description = "Start the channel-review daemon in the background"
run = '"${DG_SKILLS:-${DG_HOME:-$HOME/.dg}/bin/dg-skills}" channel-review start'

[tasks."remote:stop"]
description = "Stop the channel-review daemon"
run = '"${DG_SKILLS:-${DG_HOME:-$HOME/.dg}/bin/dg-skills}" channel-review stop'

[tasks."remote:run"]
description = "Run the channel-review daemon in the foreground"
run = '"${DG_SKILLS:-${DG_HOME:-$HOME/.dg}/bin/dg-skills}" channel-review run'

[tasks."remote:logs"]
description = "Show the last 40 lines of the channel-review daemon log"
run = '"${DG_SKILLS:-${DG_HOME:-$HOME/.dg}/bin/dg-skills}" channel-review logs --env "${CR_ENV:-dev}"'

[tasks."remote:follow"]
description = "Follow the channel-review daemon log live"
run = '"${DG_SKILLS:-${DG_HOME:-$HOME/.dg}/bin/dg-skills}" channel-review logs --env "${CR_ENV:-dev}" -f'

[tasks."remote:up"]
description = "Start the channel-review daemon and follow its log"
depends = ["remote:start"]
run = '"${DG_SKILLS:-${DG_HOME:-$HOME/.dg}/bin/dg-skills}" channel-review logs --env "${CR_ENV:-dev}" -f'

[tasks.ext]
description = "Build the extension and open it in the internal test Chrome"
run = "bun scripts/test-chrome.ts"

[tasks.daemon]
description = "Run dg-daemon in the foreground for local harness testing"
run = "bun pkg/dg-daemon/src/index.ts __serve"

[tasks.api]
description = "Run dg-agent, the chat harness CLI. Extra args follow --, for example: mise run api -- start"
run = "bun pkg/dg-agent/src/index.ts"

[tasks.agent]
description = "Run dg-agent, the chat harness CLI (alias of api)"
run = "bun pkg/dg-agent/src/index.ts"

[tasks.harness]
description = "Start dg-daemon and open the extension in the internal test Chrome"
run = "bun scripts/test-chrome.ts --with-daemon"

[tasks."install:skills"]
description = "Copy plugins/dg/skills instruction files into DG_SKILLS_DEST (no release binaries)"
run = """
bun pkg/skills-cli/src/index.ts install --skills-only --repo "${DG_SKILLS_REPO:-$PWD}" --dest "${DG_SKILLS_DEST:-${DG_HOME:-$HOME/.dg}/skills}"
"""

[tasks."test:extension"]
description = "Run the browser extension unit tests"
dir = "pkg/extension"
run = "bun test"

[tasks."test:agent"]
description = "Run the dg-agent unit tests"
dir = "pkg/dg-agent"
run = "bun test"

[tasks."test:daemon"]
description = "Run the dg-daemon unit tests"
dir = "pkg/dg-daemon"
run = "bun test"

[tasks."test:runners"]
description = "Run the channel-review runner tests, including a live CLI check when that binary is on PATH"
dir = "pkg/channel-review"
run = """
if [ "${DG_TEST_CLAUDE_CLI:-}" != "1" ] && command -v claude >/dev/null 2>&1; then
  DG_TEST_CLAUDE_CLI=1
  export DG_TEST_CLAUDE_CLI
fi
if [ "${DG_TEST_GROK_CLI:-}" != "1" ] && command -v grok >/dev/null 2>&1; then
  DG_TEST_GROK_CLI=1
  export DG_TEST_GROK_CLI
fi
bun test \
  __tests__/runners-capture.spec.ts \
  __tests__/runners-cli-fixture.spec.ts \
  __tests__/runners-cli-live.spec.ts \
  __tests__/runners-grok-stream.spec.ts \
  __tests__/runners-index.spec.ts \
  __tests__/runners-probe.spec.ts \
  __tests__/runners-spawn.spec.ts
"""

[tasks."test:runners:live"]
description = "Run the opt-in Claude and Grok CLI runner tests (requires both binaries on PATH and a signed-in session)"
dir = "pkg/channel-review"
run = """
DG_TEST_CLAUDE_CLI=1 DG_TEST_GROK_CLI=1 bun test __tests__/runners-cli-live.spec.ts
"""

[tasks."test:runners:mutate"]
description = "Mutation-test the channel-review runners against the runner suite"
dir = "pkg/channel-review"
run = "bunx stryker run"

# Optional: gitleaks is installed for this task only, not for `mise install`.
[tasks."security:scan"]
description = "Scan git history for secrets with gitleaks"
tools = { gitleaks = "8.30.1" }
run = "gitleaks detect --source . --config .gitleaks.toml --redact --verbose"
