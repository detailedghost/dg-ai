redactions = ["CHANNEL_REVIEW_RELAY_SECRET_*", "DATADOG_*", "SENTRY_*"]

[tools]
bun = "1.4.1"
node = "22"

[env]
_.file = { path = ".env", redact = false }

[tasks."remote:install"]
description = "Build the dg bundle and make it lib/current in the dg data folder for local channel-review runs"
run = """
set -e
ROOT="$(bun -e 'import { resolveDgPaths } from "./pkg/common/src/node/dg-paths.ts"; console.log(resolveDgPaths().dataDir)')"
if [ ! -x "$ROOT/runtime/current/bun" ]; then
  echo "remote:install: no runtime at $ROOT/runtime/current; run bootstrap.sh once first" >&2
  exit 1
fi
OUT="$(mktemp -d)"
trap 'rm -rf "$OUT"' EXIT
bun run --cwd pkg/launcher build --outdir "$OUT"
BASE="$(bun -e 'console.log(require("./pkg/skills-cli/package.json").version)')-local"
VERSION="$BASE.$(date +%s).$$"
bun scripts/remote-install.ts "$ROOT" "$OUT/lib" "$BASE" "$VERSION"
"""

[tasks."remote:status"]
description = "Print the channel-review daemon state and preflight check"
run = '"${DG_SKILLS:-$({ [ -n "$DG_HOME" ] && echo "$DG_HOME/bin/dg-skills"; } || command -v dg-skills || echo "$HOME/.local/bin/dg-skills")}" channel-review status'

[tasks."remote:start"]
description = "Start the channel-review daemon in the background"
run = '"${DG_SKILLS:-$({ [ -n "$DG_HOME" ] && echo "$DG_HOME/bin/dg-skills"; } || command -v dg-skills || echo "$HOME/.local/bin/dg-skills")}" channel-review start'

[tasks."remote:bedrock"]
description = "Refresh the Bedrock AWS SSO login, then restart the channel-review daemon with Claude on Bedrock"
run = """
set -e
DG="${DG_SKILLS:-$({ [ -n "$DG_HOME" ] && echo "$DG_HOME/bin/dg-skills"; } || command -v dg-skills || echo "$HOME/.local/bin/dg-skills")}"
CONFIG=$(bun -e 'import { join } from "node:path"; import { resolveDgPaths } from "./pkg/common/src/node/dg-paths.ts"; console.log(join(resolveDgPaths().configDir, "channel-review", "config.json"))')
PROFILE=$(bun -e 'const b = (await Bun.file(process.argv[1]).json()).runner?.claude?.bedrock; if (!b) { console.error("Add runner.claude.bedrock (model, region, profile) to " + process.argv[1]); process.exit(1); } console.log(b.profile ?? process.env.AWS_PROFILE ?? "")' "$CONFIG")
aws sts get-caller-identity ${PROFILE:+--profile "$PROFILE"} >/dev/null 2>&1 || aws sso login ${PROFILE:+--profile "$PROFILE"}
"$DG" channel-review stop || true
"$DG" channel-review start
"""

[tasks."remote:stop"]
description = "Stop the channel-review daemon"
run = '"${DG_SKILLS:-$({ [ -n "$DG_HOME" ] && echo "$DG_HOME/bin/dg-skills"; } || command -v dg-skills || echo "$HOME/.local/bin/dg-skills")}" channel-review stop'

[tasks."remote:run"]
description = "Run the channel-review daemon in the foreground"
run = '"${DG_SKILLS:-$({ [ -n "$DG_HOME" ] && echo "$DG_HOME/bin/dg-skills"; } || command -v dg-skills || echo "$HOME/.local/bin/dg-skills")}" channel-review run'

[tasks."remote:logs"]
description = "Show the last 40 lines of the channel-review daemon log"
run = '"${DG_SKILLS:-$({ [ -n "$DG_HOME" ] && echo "$DG_HOME/bin/dg-skills"; } || command -v dg-skills || echo "$HOME/.local/bin/dg-skills")}" channel-review logs --env "${CR_ENV:-dev}"'

[tasks."remote:follow"]
description = "Follow the channel-review daemon log live"
run = '"${DG_SKILLS:-$({ [ -n "$DG_HOME" ] && echo "$DG_HOME/bin/dg-skills"; } || command -v dg-skills || echo "$HOME/.local/bin/dg-skills")}" channel-review logs --env "${CR_ENV:-dev}" -f'

[tasks."remote:up"]
description = "Start the channel-review daemon and follow its log"
depends = ["remote:start"]
run = '"${DG_SKILLS:-$({ [ -n "$DG_HOME" ] && echo "$DG_HOME/bin/dg-skills"; } || command -v dg-skills || echo "$HOME/.local/bin/dg-skills")}" channel-review logs --env "${CR_ENV:-dev}" -f'

[tasks.ext]
description = "Build the extension and open it in the internal test Chrome"
run = "bun scripts/test-chrome.ts"

[tasks.daemon]
description = "Run dg-daemon in the foreground for local harness testing"
run = "bun pkg/dg-daemon/src/index.ts serve"

[tasks.api]
description = "Run dg-agent, the chat harness CLI. Extra args follow --, for example: mise run api -- start"
run = "bun pkg/dg-agent/src/index.ts"

[tasks.agent]
description = "Run dg-agent, the chat harness CLI (alias of api)"
run = "bun pkg/dg-agent/src/index.ts"

[tasks.harness]
description = "Start dg-daemon and open the extension in the internal test Chrome"
run = "bun scripts/test-chrome.ts --with-daemon"

[tasks."install:skills"]
description = "Copy plugins/dg/skills instruction files into DG_SKILLS_DEST (no release binaries)"
run = """
bun pkg/skills-cli/src/index.ts install --skills-only --repo "${DG_SKILLS_REPO:-$PWD}" ${DG_SKILLS_DEST:+--dest "$DG_SKILLS_DEST"}
"""

[tasks."test:extension"]
description = "Run the browser extension unit tests"
dir = "pkg/extension"
run = "bun test"

[tasks."test:ssms"]
description = "Run the ssms provider unit tests"
dir = "pkg/ssms"
run = "bun test"

[tasks."test:ssms:google"]
description = "Run the Google Messages provider tests"
dir = "pkg/ssms"
run = "bun test __tests__/google-page.spec.ts __tests__/google-provider.spec.ts __tests__/contract.spec.ts"

[tasks."test:ssms:signal"]
description = "Run the signal-cli provider tests against the fake JSON-RPC server"
dir = "pkg/ssms"
run = "bun test __tests__/signal-rpc.spec.ts __tests__/signal-provider.spec.ts __tests__/contract.spec.ts"

[tasks."test:ssms:mutate"]
description = "Mutation-test the ssms send gate, classifier, redaction, and gap picker"
dir = "pkg/ssms"
run = "bunx stryker run"

[tasks."test:inbox"]
description = "Run the inbox unit tests"
dir = "pkg/inbox"
run = "bun test"

[tasks."test:inbox:mutate"]
description = "Mutation-test the Proton filter plan and safety checks"
dir = "pkg/inbox"
run = "bunx stryker run stryker.filter-policy.conf.mjs"

[tasks."test:agent"]
description = "Run the dg-agent unit tests"
dir = "pkg/dg-agent"
run = "bun test"

[tasks."test:phone"]
description = "Run the dg-agent phone unit tests"
dir = "pkg/dg-agent"
run = "bun test __tests__/phone"

[tasks."test:phone:roster"]
description = "Run the phone roster exchange tests"
dir = "pkg/dg-agent"
run = "bun test __tests__/phone/roster.spec.ts"

[tasks."test:phone:roster:mutate"]
description = "Mutation-test phone roster exchange and session naming"
dir = "pkg/dg-agent"
run = "bunx stryker run stryker.roster.conf.mjs"

[tasks."test:phone:mutate"]
description = "Mutation-test phone roster, catch-up, ensure, and thread modules"
dir = "pkg/dg-agent"
run = "bunx stryker run stryker.phone.conf.mjs"

[tasks."test:phone:vault:mutate"]
description = "Mutation-test phone vault names, period keys, and credential-store errors"
dir = "pkg/dg-agent"
run = "bunx stryker run stryker.vault-name.conf.mjs"

[tasks."test:credentials:name:mutate"]
description = "Mutation-test case-insensitive credential name folding"
dir = "pkg/common"
run = "bunx stryker run stryker.credential-name.conf.mjs"

[tasks."test:daemon:credentials:mutate"]
description = "Mutation-test credential store name folding"
dir = "pkg/dg-daemon"
run = "bunx stryker run stryker.credential-name.conf.mjs"

[tasks."test:daemon"]
description = "Run the dg-daemon unit tests"
dir = "pkg/dg-daemon"
run = "bun test"

[tasks."test:runners"]
description = "Run the channel-review runner tests, including a live CLI check when that binary is on PATH"
dir = "pkg/channel-review"
run = """
if [ "${DG_TEST_CLAUDE_CLI:-}" != "1" ] && command -v claude >/dev/null 2>&1; then
  DG_TEST_CLAUDE_CLI=1
  export DG_TEST_CLAUDE_CLI
fi
if [ "${DG_TEST_GROK_CLI:-}" != "1" ] && command -v grok >/dev/null 2>&1; then
  DG_TEST_GROK_CLI=1
  export DG_TEST_GROK_CLI
fi
bun test \
  __tests__/runners-capture.spec.ts \
  __tests__/runners-cli-fixture.spec.ts \
  __tests__/runners-cli-live.spec.ts \
  __tests__/runners-grok-stream.spec.ts \
  __tests__/runners-index.spec.ts \
  __tests__/runners-probe.spec.ts \
  __tests__/runners-spawn.spec.ts
"""

[tasks."test:runners:live"]
description = "Run the opt-in Claude and Grok CLI runner tests (requires both binaries on PATH and a signed-in session)"
dir = "pkg/channel-review"
run = """
DG_TEST_CLAUDE_CLI=1 DG_TEST_GROK_CLI=1 bun test __tests__/runners-cli-live.spec.ts
"""

[tasks."test:runners:mutate"]
description = "Mutation-test the channel-review runners against the runner suite"
dir = "pkg/channel-review"
run = "bunx stryker run"

[tasks."test:verify"]
description = "Run the dg-skills verify unit tests and the fixture review"
dir = "pkg/skills-cli"
run = """
bun test \
  __tests__/verify-axe.spec.ts \
  __tests__/verify-manifest.spec.ts \
  __tests__/verify-board.spec.ts \
  __tests__/verify-capture.spec.ts \
  __tests__/verify-serve.spec.ts \
  __tests__/verify-review.spec.ts \
  __tests__/layout-fingerprint.spec.ts \
  __tests__/layout-diff.spec.ts \
  __tests__/verify-playwright.spec.ts
"""

[tasks."test:verify:mutate"]
description = "Mutation-test the verify manifest, URL gate, and axe summary"
dir = "pkg/skills-cli"
run = "bunx stryker run stryker.verify.conf.mjs"

# Optional: gitleaks is installed for this task only, not for `mise install`.
[tasks."security:scan"]
description = "Scan git history for secrets with gitleaks"
tools = { gitleaks = "8.30.1" }
run = "gitleaks detect --source . --config .gitleaks.toml --redact --verbose"
