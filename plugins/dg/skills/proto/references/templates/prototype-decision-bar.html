<!--
  Prototype decision bar — plain HTML/JS, no framework. Paste this block
  before </body> and serve the page with `dg-skills prototype serve`, which injects
  window.prototypeDecide. Call window.prototypeDecisionBar.setVariant(key)
  from your own switcher whenever the variant changes; single-variant
  prototypes can skip that and the default "A" is recorded.

  The mode button mirrors PrototypeSwitcher's: it writes ?mode=light|dark and
  toggles a `dark` class on <html>, so the host page can react to either signal.
-->
<div id="proto-decision-bar">
  <button type="button" id="proto-decision-mode" title="Toggle light/dark"></button>
  <span class="proto-decision-sep"></span>
  <input id="proto-decision-notes" placeholder="notes (optional)">
  <button type="button" id="proto-decision-approve">Approve &#10003;</button>
  <button type="button" id="proto-decision-reject">Reject &#10227;</button>
</div>
<div id="proto-decision-toast"></div>

<style>
  /* --pd-* prefix only, so pasting this into a themed prototype cannot clash with its tokens. */
  :root {
    --pd-bg: #ffffff; --pd-fg: #0f172a; --pd-border: #cbd5e1; --pd-field: #f8fafc;
    --pd-muted: #64748b; --pd-approve-fg: #15803d; --pd-reject-fg: #b45309;
    --pd-shadow: 0 8px 24px rgba(15, 23, 42, .18); --pd-scheme: light;
  }
  html.dark {
    --pd-bg: #0f172a; --pd-fg: #e2e8f0; --pd-border: #334155; --pd-field: #1e293b;
    --pd-muted: #94a3b8; --pd-approve-fg: #86efac; --pd-reject-fg: #fcd34d;
    --pd-shadow: 0 8px 24px rgba(0, 0, 0, .35); --pd-scheme: dark;
  }

  #proto-decision-bar, #proto-decision-toast {
    /* max-content, else left:50% caps shrink-to-fit at half the viewport and the labels wrap. */
    position: fixed; left: 50%; transform: translateX(-50%); width: max-content;
    background: var(--pd-bg); color: var(--pd-fg); border: 1px solid var(--pd-border);
    border-radius: 10px; box-shadow: var(--pd-shadow); z-index: 9999;
    color-scheme: var(--pd-scheme);
    font: 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #proto-decision-bar {
    bottom: 14px; display: flex; align-items: center; gap: 8px; padding: 8px 10px;
  }
  #proto-decision-toast {
    bottom: 68px; padding: 10px 14px; max-width: 60ch;
    opacity: 0; pointer-events: none; transition: opacity .2s ease-out;
  }
  #proto-decision-bar button {
    border: 1px solid var(--pd-border); color: var(--pd-fg); background: transparent;
    border-radius: 8px; padding: 7px 11px; font-size: 12px; cursor: pointer;
  }
  /* Id-plus-id, else the `#bar button` shorthand above outranks these and eats the accent. */
  #proto-decision-bar #proto-decision-approve { border-color: #15803d; color: var(--pd-approve-fg); }
  #proto-decision-bar #proto-decision-reject { border-color: #b45309; color: var(--pd-reject-fg); }
  #proto-decision-notes {
    background: var(--pd-field); border: 1px solid var(--pd-border); color: var(--pd-fg);
    border-radius: 8px; padding: 7px 9px; font-size: 12px; width: 170px;
  }
  #proto-decision-notes::placeholder { color: var(--pd-muted); }
  .proto-decision-sep { width: 1px; height: 18px; background: var(--pd-border); }

  /* Same radial-burst technique as PrototypeSwitcher's approve confetti — kept in sync. */
  @keyframes proto-decision-burst { 0% { transform:translate(0,0) rotate(0); opacity:1 } 100% { transform:translate(var(--dx),var(--dy)) rotate(var(--rot)); opacity:0 } }
  .proto-decision-confetti-particle {
    position:fixed;top:38vh;left:50%;width:10px;height:14px;border-radius:2px;
    pointer-events:none;z-index:10000;animation:proto-decision-burst .9s ease-out forwards;
  }
</style>

<script>
(() => {
  var currentVariant = "A";
  window.prototypeDecisionBar = {
    setVariant: (v) => { currentVariant = String(v); },
  };

  // Same ?mode= contract as PrototypeSwitcher, so a host page reacts identically to both.
  var modeBtn = document.getElementById("proto-decision-mode");
  function readMode() {
    return new URLSearchParams(window.location.search).get("mode") === "dark" ? "dark" : "light";
  }
  function syncMode() {
    var m = readMode();
    document.documentElement.classList.toggle("dark", m === "dark");
    modeBtn.textContent = m === "dark" ? "☀ Light" : "☾ Dark";
  }
  syncMode();
  window.addEventListener("popstate", syncMode);
  modeBtn.addEventListener("click", () => {
    var url = new URL(window.location.href);
    url.searchParams.set("mode", readMode() === "dark" ? "light" : "dark");
    history.replaceState(null, "", url.toString());
    window.dispatchEvent(new PopStateEvent("popstate"));
  });

  var toast = document.getElementById("proto-decision-toast");
  function say(msg) {
    toast.textContent = msg;
    toast.style.opacity = "1";
    clearTimeout(say._t);
    say._t = setTimeout(() => { toast.style.opacity = "0"; }, 5000);
  }

  var CONFETTI_COLORS = ["#22c55e", "#4c8dff", "#a855f7", "#f59e0b", "#f43f5e", "#14b8a6"];
  // One-shot radial burst on approve; skipped for prefers-reduced-motion.
  function confettiBurst() {
    if (window.matchMedia?.("(prefers-reduced-motion: reduce)").matches) return;
    for (let i = 0; i < 28; i++) {
      const angle = (2 * Math.PI * i) / 28 + (i % 3) * 0.12;
      const dist = 160 + (i % 5) * 44;
      const el = document.createElement("div");
      el.className = "proto-decision-confetti-particle";
      el.style.setProperty("--dx", `${Math.cos(angle) * dist}px`);
      el.style.setProperty("--dy", `${Math.sin(angle) * dist - 40}px`);
      el.style.setProperty("--rot", `${i * 47}deg`);
      el.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
      el.style.animationDelay = `${(i % 6) * 0.03}s`;
      document.body.appendChild(el);
      ((particle) => { setTimeout(() => particle.remove(), 1200); })(el);
    }
  }

  // window.prototypeDecide is injected by `dg-skills prototype serve`. Opened straight
  // off disk (file://) there is no server, so say so instead of failing silently.
  function decide(action) {
    var notes = document.getElementById("proto-decision-notes").value.trim();
    if (action === "reject" && !notes) {
      say("Add a note first — a rework needs direction.");
      return;
    }
    if (typeof window.prototypeDecide !== "function") {
      say(`No server here — open the localhost URL dg-skills prototype serve printed, or just tell the agent variant ${currentVariant}.`);
      return;
    }
    window.prototypeDecide(action, currentVariant, notes);
    if (action === "confirm") confettiBurst();
    say(action === "confirm" ? `Approved variant ${currentVariant} in ${readMode()} mode. You can close this tab.` : "Sent back for rework.");
  }

  document.getElementById("proto-decision-approve").addEventListener("click", () => { decide("confirm"); });
  document.getElementById("proto-decision-reject").addEventListener("click", () => { decide("reject"); });
})();
</script>
