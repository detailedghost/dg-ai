<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeeGee — Approve</title>
  </head>
  <body>
    <main>
      <div class="panel">
        <h2 class="sec-h" id="title">Approval request</h2>
        <p class="note" id="origin"></p>
        <ul id="lines"></ul>
        <p class="note" id="gone" hidden>This request was answered or has expired. You can close this window.</p>
        <div class="flex flex-wrap items-center gap-3" id="actions" hidden>
          <button class="btn" id="allow" type="button">Allow</button>
          <button class="btn" id="deny" type="button">Deny</button>
        </div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
