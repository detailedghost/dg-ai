<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Authorize DeeGee CLI</title>
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<main>
			<p class="eyebrow">DeeGee local connection</p>
			<h1>Authorize this CLI connection?</h1>
			<p>
				This permits one local DeeGee CLI session to open a sanitized
				mailbox cleanup plan. It does not approve or execute mailbox
				changes.
			</p>
			<dl>
				<div><dt>Local endpoint</dt><dd id="origin">Checking…</dd></div>
				<div><dt>Run</dt><dd id="run">Checking…</dd></div>
				<div><dt>Expires</dt><dd id="expires">Checking…</dd></div>
			</dl>
			<p id="status" role="status" aria-live="polite"></p>
			<div class="actions">
				<button id="deny" type="button">Deny</button>
				<button id="approve" type="button" class="primary">Authorize once</button>
			</div>
		</main>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
